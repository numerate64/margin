<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Calculator</title>
    <script>
        const savedTheme = localStorage.getItem('priceCalculatorTheme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        document.documentElement.dataset.theme = savedTheme || (prefersDark ? 'dark' : 'light');
    </script>
    <style>
        :root {
            --page-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --panel-bg: #ffffff;
            --panel-shadow: rgba(0, 0, 0, 0.3);
            --text-primary: #333333;
            --text-secondary: #555555;
            --text-muted: #666666;
            --input-bg: #ffffff;
            --input-border: #e0e0e0;
            --placeholder: #aaaaaa;
            --toggle-bg: #f1f3f5;
            --toggle-active-bg: #ffffff;
            --result-bg: #f8f9fa;
            --accent: #667eea;
            --accent-strong: #764ba2;
            --danger: #dc3545;
            --link-bg: #f8f9fa;
            --link-border: #e0e0e0;
        }

        :root[data-theme="dark"] {
            --page-bg: linear-gradient(135deg, #171923 0%, #2d2438 100%);
            --panel-bg: #1f2430;
            --panel-shadow: rgba(0, 0, 0, 0.55);
            --text-primary: #f3f4f6;
            --text-secondary: #d6dae3;
            --text-muted: #aeb5c2;
            --input-bg: #151923;
            --input-border: #3a4354;
            --placeholder: #7e8798;
            --toggle-bg: #151923;
            --toggle-active-bg: #2c3342;
            --result-bg: #151923;
            --accent: #9da8ff;
            --accent-strong: #c5a9ff;
            --danger: #ff7b86;
            --link-bg: #151923;
            --link-border: #3a4354;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--page-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-primary);
        }

        .calculator {
            background: var(--panel-bg);
            border-radius: 20px;
            box-shadow: 0 20px 60px var(--panel-shadow);
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 24px;
        }

        .repo-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 0 12px;
            border: 1px solid var(--link-border);
            border-radius: 8px;
            background: var(--link-bg);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: border-color 0.2s, color 0.2s;
        }

        .repo-link:hover,
        .repo-link:focus-visible {
            border-color: var(--accent);
            color: var(--accent);
            outline: none;
        }

        .theme-control {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        .theme-control input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .theme-switch {
            position: relative;
            width: 46px;
            height: 26px;
            border-radius: 999px;
            background: var(--toggle-bg);
            border: 1px solid var(--input-border);
            transition: background 0.2s, border-color 0.2s;
        }

        .theme-switch::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            transition: transform 0.2s;
        }

        .theme-control input:checked + .theme-switch::after {
            transform: translateX(20px);
        }

        .theme-control input:focus-visible + .theme-switch {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .calculator h1 {
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 30px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 16px;
            transition: border-color 0.3s, background 0.3s, color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-group input::placeholder {
            color: var(--placeholder);
        }

        .calculation-toggle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 20px;
            padding: 4px;
            background: var(--toggle-bg);
            border-radius: 10px;
        }

        .calculation-toggle input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .calculation-toggle label {
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
        }

        .calculation-toggle input:checked + label {
            background: var(--toggle-active-bg);
            color: var(--accent);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .calculation-toggle input:focus-visible + label {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .calculate-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .calculate-btn:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: var(--result-bg);
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-label {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 5px;
        }

        .result-value {
            color: var(--accent);
            font-size: 32px;
            font-weight: 700;
        }

        .result-value.currency {
            color: var(--accent-strong);
        }

        .result-detail {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 8px;
        }

        .error-message {
            color: var(--danger);
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .mode-toggle {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .toggle-btn {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            margin: 0 5px;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .toggle-btn:hover:not(.active) {
            border-color: #667eea;
        }

        .spreadsheet-section {
            display: none;
        }

        .spreadsheet-section.active {
            display: block;
        }

        .table-container {
            overflow-x: auto;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        th, td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #555;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            font-size: 14px;
        }

        .table-input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .table-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .table-input.small {
            width: 80px;
        }

        .table-input.large {
            width: 100px;
        }

        .table-input.readonly {
            background: #f8f9fa;
            color: #555;
            font-weight: 500;
        }

        .table-actions {
            text-align: center;
        }

        .action-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            margin: 0 5px;
        }

        .add-btn {
            background: #28a745;
            color: white;
        }

        .add-btn:hover {
            background: #218838;
        }

        .remove-btn {
            background: #dc3545;
            color: white;
        }

        .remove-btn:hover {
            background: #c82333;
        }

        .clear-btn {
            background: #6c757d;
            color: white;
        }

        .clear-btn:hover {
            background: #5a6268;
        }

        .totals-row {
            background: #f0f3f5;
            font-weight: 600;
            color: #333;
        }

        .totals-row td {
            border-top: 2px solid #e0e0e0;
            padding: 12px 8px;
        }

        .mode-container {
            max-width: 1000px;
        }

        .mode-container .calculator {
            max-width: 1000px;
            padding: 40px;
        }

        @media (max-width: 768px) {
            .mode-container .calculator {
                padding: 20px;
            }

            th, td {
                padding: 10px 6px;
                font-size: 13px;
            }

            .table-input {
                padding: 6px 8px;
                font-size: 13px;
            }

            .table-input.small {
                width: 70px;
            }

            .table-input.large {
                width: 90px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="top-bar">
            <a class="repo-link" href="https://github.com/numerate64/margin" target="_blank" rel="noopener noreferrer">GitHub Repo</a>
            <label class="theme-control" for="themeToggle">
                <input type="checkbox" id="themeToggle" aria-label="Toggle dark mode">
                <span class="theme-switch" aria-hidden="true"></span>
                <span id="themeLabel">Dark</span>
            </label>
        </div>
        <h1>Price Calculator</h1>
        <form id="calculatorForm">
            <div class="calculation-toggle" role="radiogroup" aria-label="Calculation type">
                <input type="radio" id="marginMode" name="calculationType" value="margin" checked>
                <label for="marginMode">Margin</label>
                <input type="radio" id="markupMode" name="calculationType" value="markup">
                <label for="markupMode">Markup</label>
            </div>
            <div class="form-group">
                <label for="cost">Cost ($)</label>
                <input
                    type="number"
                    id="cost"
                    name="cost"
                    step="0.01"
                    min="0"
                    placeholder="Enter cost"
                    required
                >
            </div>
            <div class="form-group">
                <label for="percentage" id="percentageLabel">Margin (%)</label>
                <input
                    type="number"
                    id="percentage"
                    name="percentage"
                    step="0.01"
                    min="0"
                    placeholder="Enter margin (e.g., 20)"
                    required
                >
            </div>
            <button type="submit" class="calculate-btn">Calculate Price</button>
            <div class="error-message" id="errorMessage" role="alert"></div>
        </form>
        <div class="result" id="result">
            <div class="result-label">Your Price</div>
            <div class="result-value currency" id="price">$0.00</div>
            <div class="result-detail" id="resultDetail"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('calculatorForm');
        const result = document.getElementById('result');
        const priceElement = document.getElementById('price');
        const resultDetail = document.getElementById('resultDetail');
        const errorMessage = document.getElementById('errorMessage');
        const percentageInput = document.getElementById('percentage');
        const percentageLabel = document.getElementById('percentageLabel');
        const calculationTypeInputs = document.querySelectorAll('input[name="calculationType"]');
        const themeToggle = document.getElementById('themeToggle');
        const themeLabel = document.getElementById('themeLabel');

        function setTheme(theme) {
            document.documentElement.dataset.theme = theme;
            localStorage.setItem('priceCalculatorTheme', theme);
            themeToggle.checked = theme === 'dark';
            themeLabel.textContent = theme === 'dark' ? 'Light' : 'Dark';
        }

        setTheme(document.documentElement.dataset.theme);

        themeToggle.addEventListener('change', function() {
            setTheme(this.checked ? 'dark' : 'light');
        });

        function getCalculationType() {
            return document.querySelector('input[name="calculationType"]:checked').value;
        }

        function updatePercentageCopy() {
            const calculationType = getCalculationType();
            const label = calculationType === 'margin' ? 'Margin (%)' : 'Markup (%)';
            const placeholder = calculationType === 'margin'
                ? 'Enter margin (e.g., 20)'
                : 'Enter markup (e.g., 20)';

            percentageLabel.textContent = label;
            percentageInput.placeholder = placeholder;
            result.classList.remove('show');
            errorMessage.classList.remove('show');
        }

        calculationTypeInputs.forEach(input => {
            input.addEventListener('change', updatePercentageCopy);
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const cost = parseFloat(document.getElementById('cost').value);
            const percentage = parseFloat(percentageInput.value);
            const calculationType = getCalculationType();

            if (isNaN(cost) || isNaN(percentage)) {
                return;
            }

            if (calculationType === 'margin' && percentage >= 100) {
                result.classList.remove('show');
                errorMessage.textContent = 'Margin must be less than 100%.';
                errorMessage.classList.add('show');
                return;
            }

            const price = calculationType === 'margin'
                ? cost / (1 - (percentage / 100))
                : cost * (1 + (percentage / 100));
            const calculationLabel = calculationType === 'margin' ? 'margin' : 'markup';

            priceElement.textContent = '$' + price.toFixed(2);
            resultDetail.textContent = `Using ${percentage.toFixed(2)}% ${calculationLabel}.`;
            result.classList.add('show');
            errorMessage.classList.remove('show');
        });
    </script>
</body>
</html>
